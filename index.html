<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Viewer</title>
<style>
  :root { --bg: #e9e7e2; --panel: rgba(255,255,255,0.88); --text: #222; --accent: #4b5a2a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px;
        max-width: calc(100% - 24px); }
  #ui button { border: 0; border-radius: 6px; padding: 7px 11px; background: var(--panel);
               color: var(--text); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #ui button.on { background: var(--accent); color: #fff; }
  #rooms { position: absolute; top: 52px; left: 12px; display: flex; flex-direction: column; gap: 6px;
           max-width: calc(100% - 24px); }
  #rooms .row { display: flex; flex-wrap: wrap; gap: 6px; }
  #rooms button { border: 0; border-radius: 6px; padding: 6px 10px; background: var(--panel);
                  color: var(--text); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #rooms button.on { background: var(--accent); color: #fff; }
  #angles button { font-size: 12px; padding: 5px 9px; }
  #hint { position: absolute; bottom: 10px; left: 12px; opacity: .65; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading house…</div>
<div id="ui">
  <button data-view="album" class="on">Album view</button>
  <button data-view="ground">Ground floor</button>
  <button data-view="house">Whole house</button>
  <button id="upper">Show upper floors</button>
</div>
<div id="rooms"><div class="row" id="roomlist"></div><div class="row" id="angles"></div></div>
<div id="hint">Drag to orbit · right-drag to pan · scroll to zoom · keys 1–3 switch angle</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
// same grading as the Blender renders: AgX, exposure +0.45 EV (white balance is in the shader)
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = Math.pow(2, 0.45);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xecebe4);  // the hazy afternoon sky seen through the windows
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

const sun = new THREE.DirectionalLight(0xfff4e5, 2.2);
sun.position.set(-8, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.target.position.set(4.6, 0, -6.4);
scene.add(sun, sun.target);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
window.viewer = { camera, controls };  // handy for debugging from the console
controls.enableDamping = true;

// Blender (x, y, z) -> three (x, z, -y)
const B = (x, y, z) => new THREE.Vector3(x, z, -y);
const VIEWS = {
  // Cam_G_Reference in Blender: 20 mm lens (36 mm sensor), shift_y -0.06, clip 0.82 m
  album:   { pos: B(3.35, 3.25, 1.05), target: B(2.10, 11.0, 1.05), upper: true,
             hfov: 2 * Math.atan(18 / 20), shiftY: -0.06, near: 0.82 },
  ground:  { pos: B(4.6, -5.5, 13.0), target: B(4.6, 6.4, 0.0), upper: false },
  house:   { pos: B(-9.0, -14.0, 9.0), target: B(4.6, 6.0, 3.0), upper: true },
};

// Interior angles per room: eye position (Blender x, y, z), heading (deg, 0 = +X, 90 = +Y
// towards the garden), pitch (deg) and lens (mm, 36 mm sensor). Taken from the Cam_G_* cameras
// in house.blend and the stops of blender/flythrough.py.
const EYE = (x, y, z, yaw, pitch, lens) => {
  const a = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch), d = 1.5;
  return { pos: B(x, y, z),
           target: B(x + d * Math.cos(a) * Math.cos(p), y + d * Math.sin(a) * Math.cos(p), z + d * Math.sin(p)),
           upper: true, hfov: 2 * Math.atan(18 / lens), shiftY: 0, near: 0.05 };
};
const ROOMS = {
  Hall: [
    ["From the front door", EYE(5.62, 1.64, 1.40, 112, 2, 15)],
    ["Mirror and coats",    EYE(5.25, 2.40, 1.50, 160, -6, 16)],
    ["Back to the door",    EYE(4.85, 3.70, 1.50, -75, -8, 16)],
  ],
  Living: [
    ["Down the room",       EYE(3.15, 4.12, 1.45, 103, -3, 17)],
    ["Sofa and rug",        EYE(3.60, 5.30, 1.50, 185, -12, 16)],
    ["Sofa from the TV",    EYE(4.40, 6.60, 1.50, 200, -10, 18)],
  ],
  Dining: [
    ["Table and bookcase",  EYE(3.95, 8.00, 1.50, 145, -8, 16)],
    ["From the garden end", EYE(2.90, 10.45, 1.35, 265, -3, 18)],
    ["Corner by the window",EYE(1.15, 10.35, 1.50, -40, -12, 16)],
  ],
  Kitchen: [
    ["Counter and windows", EYE(7.10, 9.05, 1.30, 95, -5, 20)],
    ["From the island end", EYE(8.15, 11.65, 1.50, 214, -7, 18)],
    ["Across the island",   EYE(8.30, 9.30, 1.50, 150, -8, 16)],
  ],
  Study: [
    ["Desk and bench",      EYE(3.30, 3.62, 1.32, 241, -7, 20)],
    ["Wall shelves",        EYE(2.95, 2.50, 1.50, 150, -8, 16)],
    ["Corner to the door",  EYE(0.75, 0.75, 1.50, 45, -10, 16)],
  ],
  Guest: [
    ["From the door",       EYE(6.52, 4.70, 1.55, -57, -13, 16)],
    ["Daybed and desk",     EYE(7.35, 3.55, 1.50, -60, -14, 16)],
    ["Back from the window",EYE(7.60, 1.75, 1.50, 125, -10, 16)],
  ],
  Washbasin: [
    ["Under the stair",     EYE(5.49, 8.15, 1.48, 270, -10, 18)],
    ["From the corridor",   EYE(5.85, 8.30, 1.55, 235, -18, 16)],
  ],
  Laundry: [
    ["From the door",       EYE(7.30, 8.16, 1.42, 270, -8, 16)],
    ["Curtain and radiator",EYE(6.45, 7.40, 1.50, 15, -12, 16)],
  ],
  Bathroom: [
    ["Shower and vanity",   EYE(7.56, 6.19, 1.30, 270, -4, 14)],
    ["Toilet and ladder",   EYE(7.74, 5.78, 1.50, 330, -14, 16)],
    ["Into the shower",     EYE(7.74, 5.80, 1.50, 225, -14, 16)],
  ],
};
let room = null;
function showRoom(name, i = 0) {
  room = name;
  document.querySelectorAll("#roomlist button").forEach(b => b.classList.toggle("on", b.textContent === name));
  const angles = document.getElementById("angles");
  angles.innerHTML = "";
  ROOMS[name].forEach(([label], k) => {
    const b = document.createElement("button");
    b.textContent = `${k + 1}. ${label}`;
    b.onclick = () => goAngle(k);
    angles.appendChild(b);
  });
  goAngle(i);
}
function goAngle(i) {
  const views = ROOMS[room];
  if (!views[i]) return;
  setView(views[i][1]);
  document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("on"));
  document.querySelectorAll("#angles button").forEach((b, k) => b.classList.toggle("on", k === i));
}
function clearRoom() {
  room = null;
  document.getElementById("angles").innerHTML = "";
  document.querySelectorAll("#roomlist button").forEach(b => b.classList.remove("on"));
}
for (const name of Object.keys(ROOMS)) {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => showRoom(name);
  document.getElementById("roomlist").appendChild(b);
}
addEventListener("keydown", e => { if (room && e.key >= "1" && e.key <= "9") goAngle(+e.key - 1); });

const UPPER = /^(first_|attic_|Roof|Flat_Roof)/;
let upperParts = [], showUpper = false;

function setUpper(on) {
  showUpper = on;
  upperParts.forEach(o => (o.visible = on));
  document.getElementById("upper").classList.toggle("on", on);
  document.getElementById("upper").textContent = on ? "Hide upper floors" : "Show upper floors";
}
function frameCamera() {
  const v = current;
  const aspect = innerWidth / innerHeight;
  camera.near = v && v.near ? v.near : 0.05;
  if (v && v.hfov) {  // match a Blender camera: horizontal FOV and vertical lens shift
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(v.hfov / 2) / aspect));
    camera.setViewOffset(innerWidth, innerHeight, 0, v.shiftY * -innerWidth, innerWidth, innerHeight);
  } else {
    camera.fov = 45;
    camera.clearViewOffset();
  }
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
let current = null;
function setView(v) {
  current = v;
  frameCamera();
  camera.position.copy(v.pos);
  controls.target.copy(v.target);
  setUpper(v.upper);
}
function go(name) {
  setView(VIEWS[name]);
  clearRoom();
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === name));
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
document.getElementById("upper").onclick = () => setUpper(!showUpper);

// Baked surfaces (materials "viewer_*" from blender/export_viewer.py): colour map x light
// map, with the light map stored as light / LIGHT_SCALE in the emissive slot.
const LIGHT_SCALE = 8.0;
const WHITE_BALANCE = new THREE.Vector3(1.040, 0.996, 0.930);  // Blender's 7000 K setting
function bakedMaterial(m) {
  return new THREE.ShaderMaterial({
    name: m.name,
    side: m.side,
    uniforms: { map: { value: m.map }, lightMap: { value: m.emissiveMap },
                scale: { value: m.emissiveMap ? LIGHT_SCALE : 1.0 }, wb: { value: WHITE_BALANCE } },
    defines: m.emissiveMap ? { USE_LIGHT: "" } : {},
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D map; uniform sampler2D lightMap; uniform float scale; uniform vec3 wb;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(map, vUv).rgb;
        #ifdef USE_LIGHT
          c *= texture2D(lightMap, vUv).rgb * scale;
        #endif
        gl_FragColor = vec4(c * wb, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
}

const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/");
new GLTFLoader().setDRACOLoader(draco).load("house.glb?t=" + Date.now(), gltf => {  // never a stale cached model
  const root = gltf.scene;
  let baked = 0;
  root.traverse(o => {
    if (o.isMesh) {
      if (o.material.name.startsWith("viewer_") && o.material.map) {
        o.material = bakedMaterial(o.material);
        o.castShadow = o.receiveShadow = false;  // light is already in the bake
        baked++;
      } else {
        o.castShadow = o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => { if (m.transparent) o.castShadow = false; });
      }
    }
    if (o.parent === root && UPPER.test(o.name)) upperParts.push(o);
  });
  console.log("baked meshes:", baked);
  scene.add(root);
  document.getElementById("loading").remove();
  go("album");
}, undefined, err => {
  document.getElementById("loading").textContent = "Could not load house.glb: " + err.message;
});

addEventListener("resize", () => {
  frameCamera();
  renderer.setSize(innerWidth, innerHeight);
});
// orbiting away from a matched view goes back to a normal perspective
controls.addEventListener("start", () => {
  if (current && (current.shiftY || current.near)) { current = { ...current, shiftY: 0, near: 0 }; frameCamera(); }
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
