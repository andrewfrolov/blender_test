<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Viewer</title>
<style>
  :root { --bg: #e9e7e2; --panel: rgba(255,255,255,0.88); --text: #222; --accent: #4b5a2a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  /* the button rows stack, so a row that wraps on a narrow screen pushes the next one down */
  #bar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; flex-direction: column;
         align-items: flex-start; gap: 6px; pointer-events: none; }
  #bar .row { display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
  #bar .row:empty { display: none; }
  #bar button { border: 0; border-radius: 6px; padding: 6px 10px; background: var(--panel);
                color: var(--text); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); font: inherit; }
  #ui button { padding: 7px 11px; }
  #bar button.on { background: var(--accent); color: #fff; }
  #angles button { font-size: 12px; padding: 5px 9px; }
  #hint { position: absolute; bottom: 10px; left: 12px; right: 12px; opacity: .65; }
  #hint .touch { display: none; }
  @media (max-width: 600px) {
    #bar { top: 8px; left: 8px; right: 8px; gap: 5px; }
    #bar .row { gap: 5px; }
    #bar button, #ui button { padding: 5px 8px; font-size: 12px; }
    #angles button { font-size: 11px; padding: 4px 7px; }
  }
  @media (hover: none) {
    #hint .keys { display: none; }
    #hint .touch { display: inline; }
  }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading house…</div>
<div id="bar">
<div id="ui" class="row">
  <button id="tour">▶ Tour</button>
  <button data-view="album" class="on">Album view</button>
  <button data-view="house">Whole house</button>
</div>
<div class="row" id="floorlist"></div>
<div class="row" id="roomlist"></div>
<div class="row" id="angles"></div>
</div>
<div id="hint"><span class="keys">Drag to orbit · right-drag to pan · scroll to zoom · keys 1–3 switch angle · space pauses the tour, Esc ends it</span><span class="touch">Drag to orbit · two fingers to pan and zoom</span></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// The same 10-minute cache can serve an old index.html right after a deploy. Ask the server
// for the page's Last-Modified; if a newer version is live, reload once to pick it up.
(async () => {
  try {
    const r = await fetch(location.pathname + location.search, { method: "HEAD", cache: "no-store" });
    const live = Date.parse(r.headers.get("last-modified"));
    const mine = Date.parse(document.lastModified);
    if (live > mine + 1000 && sessionStorage.getItem("reloadedFor") !== String(live)) {
      sessionStorage.setItem("reloadedFor", String(live));  // at most one reload per version
      await fetch(location.pathname + location.search, { cache: "reload" });  // refresh the cached copy
      location.reload();
    }
  } catch {}  // offline, or storage blocked: keep the page we have
})();

// Phones and tablets run out of memory on the full model: about 1,500 textures, 260 megapixels
// (some 1.3 GB on the GPU), and 165 MB of geometry held twice. "Lite" (a touch screen as the
// main pointer; ?lite and ?full override the check) loads textures at half size, at most
// 1024 px, drops the CPU copies of textures and geometry once they are on the GPU, and uses
// a smaller shadow map and pixel ratio. See lighten() and smallBitmap().
const params = new URLSearchParams(location.search);
const LITE = params.has("lite") || (!params.has("full") && matchMedia("(pointer: coarse)").matches);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, LITE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
// same grading as the Blender renders: AgX, exposure +0.45 EV (white balance is in the shader)
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = Math.pow(2, 0.45);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xecebe4);  // the hazy afternoon sky seen through the windows
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
// the canal is a near-black mirror: it reflects the hazy sky, not the studio's light panels
const skyEnv = (() => { const s = new THREE.Scene(); s.background = scene.background; return pmrem.fromScene(s).texture; })();

const sun = new THREE.DirectionalLight(0xfff4e5, 2.2);
sun.position.set(-8, 14, 10);
sun.castShadow = true;
sun.shadow.mapSize.setScalar(LITE ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40 });
sun.shadow.bias = -0.0004;
sun.target.position.set(4.6, 0, -6.4);
scene.add(sun, sun.target);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 200);
const controls = new OrbitControls(camera, renderer.domElement);
window.viewer = { camera, controls, scene, renderer };  // handy for debugging from the console
controls.enableDamping = true;

// Blender (x, y, z) -> three (x, z, -y)
const B = (x, y, z) => new THREE.Vector3(x, z, -y);
// level: what is shown, by storey (see levelOf): 0 the ground floor only, 1 up to the first
// floor, 2 up to the attic without its ceiling and the roof, 3 everything
const VIEWS = {
  // Cam_G_Reference in Blender: 20 mm lens (36 mm sensor), shift_y -0.06, clip 0.82 m
  album:   { pos: B(3.35, 3.25, 1.05), target: B(2.10, 11.0, 1.05), level: 3,
             hfov: 2 * Math.atan(18 / 20), shiftY: -0.06, near: 0.82 },
  ground:  { pos: B(4.6, -5.5, 13.0), target: B(4.6, 6.4, 0.0), level: 0 },
  first:   { pos: B(3.2, -5.0, 15.0), target: B(3.2, 5.6, 2.715), level: 1 },
  attic:   { pos: B(3.2, -3.5, 16.0), target: B(3.2, 5.6, 5.43), level: 2 },
  house:   { pos: B(-9.0, -14.0, 9.0), target: B(4.6, 6.0, 3.0), level: 3 },
};

// Interior angles per room: eye position (Blender x, y, z), heading (deg, 0 = +X, 90 = +Y
// towards the garden), pitch (deg) and lens (mm, 36 mm sensor). Taken from the Cam_G_* cameras
// in house.blend and the stops of blender/flythrough.py.
const EYE = (x, y, z, yaw, pitch, lens) => {
  const a = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch), d = 1.5;
  return { pos: B(x, y, z),
           target: B(x + d * Math.cos(a) * Math.cos(p), y + d * Math.sin(a) * Math.cos(p), z + d * Math.sin(p)),
           level: 3, hfov: 2 * Math.atan(18 / lens), shiftY: 0, near: 0.05 };
};
// the same from an eye point and a target point (the Cam_F1_* / Cam_F2_* cameras in house.blend)
const LOOK = (eye, at, lens) => ({ pos: B(...eye), target: B(...at), level: 3,
                                   hfov: 2 * Math.atan(18 / lens), shiftY: 0, near: 0.05 });
const Z1 = 2.715, Z2 = 5.43;  // first floor and attic levels (config.FLOOR_TO_FLOOR: ceiling 2.465 + slab 0.25)
const GROUND_ROOMS = {
  Hall: [
    ["From the front door", EYE(5.62, 1.64, 1.40, 112, 2, 15)],
    ["Mirror and coats",    EYE(5.25, 2.40, 1.50, 160, -6, 16)],

  ],

    ["Down the room",       EYE(3.15, 4.12, 1.45, 103, -3, 17)],
    ["Sofa and rug",        EYE(3.60, 5.30, 1.50, 185, -12, 16)],

  ],

    ["Table and bookcase",  EYE(3.95, 8.00, 1.50, 145, -8, 16)],

  ],

    ["Desk and bench",      EYE(3.30, 3.62, 1.32, 241, -7, 20)],
    ["Wall shelves",        EYE(2.95, 2.50, 1.50, 150, -8, 16)],
    ["Corner to the door",  EYE(0.75, 0.75, 1.50, 45, -10, 16)],
  ],
  Guest: [
    ["From the door",       EYE(6.52, 4.70, 1.55, -57, -13, 16)],
    ["Daybed and desk",     EYE(7.35, 3.55, 1.50, -60, -14, 16)],
    ["Back from the window",EYE(7.60, 1.75, 1.50, 125, -10, 16)],
  ],
  Washbasin: [
    ["Under the stair",     EYE(5.49, 8.15, 1.48, 270, -10, 18)],
    ["From the corridor",   EYE(5.85, 8.30, 1.55, 235, -18, 16)],
  ],
  Laundry: [
    ["From the door",       EYE(7.30, 8.16, 1.42, 270, -8, 16)],
    ["Curtain and radiator",EYE(6.45, 7.40, 1.50, 15, -12, 16)],
  ],

    ["Shower and vanity",   EYE(7.56, 6.19, 1.30, 270, -4, 14)],
    ["Toilet and ladder",   EYE(7.74, 5.78, 1.50, 330, -14, 16)],
    ["Into the shower",     EYE(7.74, 5.80, 1.50, 225, -14, 16)],
  ],
};
// first floor and attic: album part 2 views (page numbers in the comments)
const FIRST_ROOMS = {
  "Master bedroom": [
    ["Bed and wardrobe",    LOOK([3.72, 0.67, Z1 + 1.13], [1.34, 2.49, Z1 + 0.96], 17)],    // p10
    ["To the window",       LOOK([0.55, 3.98, Z1 + 0.98], [2.19, 1.46, Z1 + 0.98], 18.5)],  // p12
    ["Over the bed",        LOOK([0.48, 0.80, Z1 + 2.15], [2.06, 2.62, Z1 + 0.37], 18)],    // p08
    ["Walk-in wardrobe",    LOOK([1.45, 2.90, Z1 + 1.45], [1.45, 5.20, Z1 + 1.20], 20)],
  ],
  "Child's room": [
    ["From the bed",        LOOK([5.88, 7.20, Z1 + 0.80], [3.85, 9.41, Z1 + 0.85], 17)],    // p19
    ["From above",          LOOK([3.40, 10.66, Z1 + 2.44], [4.30, 8.25, Z1 - 0.05], 17)],   // p15
    ["Rocker and shelves",  LOOK([3.42, 7.24, Z1 + 0.92], [5.14, 9.70, Z1 + 1.20], 15)],    // p17
  ],
  Bathroom: [
    ["From the door",       LOOK([4.75, 4.97, Z1 + 1.12], [4.86, 1.97, Z1 + 1.12], 15.5)],  // p22
    ["Back to the door",    LOOK([5.12, 1.65, Z1 + 0.95], [5.13, 4.65, Z1 + 0.95], 18.8)],  // p24
  ],
  Study: [
    ["Sofa and shelves",    LOOK([2.58, 6.52, Z1 + 1.75], [0.85, 7.95, Z1 + 0.68], 14.5)],  // p33
    ["From the desk",       LOOK([2.18, 10.48, Z1 + 1.20], [0.70, 6.25, Z1 + 0.78], 17)],   // p35
  ],
  Landing: [

  ],
};
const ATTIC_ROOMS = {
  Bedroom: [
    ["Desk and roof window",LOOK([2.78, 8.28, Z2 + 1.10], [1.16, 4.63, Z2 + 0.80], 20)],   // p39
    ["Bed on the podium",   LOOK([2.00, 3.14, Z2 + 1.12], [1.07, 6.94, Z2 + 0.55], 20)],   // p43
    ["To the door",         LOOK([0.60, 3.40, Z2 + 1.30], [2.72, 6.71, Z2 + 0.65], 17)],   // p41
  ],
  Bathroom: [
    ["Basin niche and bench",LOOK([4.63, 5.02, Z2 + 1.46], [4.63, 3.50, Z2 + 1.30], 14)],    // p48
    ["From above",          LOOK([5.52, 4.93, Z2 + 2.66], [4.54, 4.33, Z2 + 1.02], 20)],    // p46
  ],

};
const FLOORS = {
  "Ground floor": { view: "ground", rooms: GROUND_ROOMS },
  "First floor":  { view: "first", rooms: FIRST_ROOMS },
  "Attic":        { view: "attic", rooms: ATTIC_ROOMS },
};
let floor = null, room = null, ROOMS = GROUND_ROOMS;
function showFloor(name) {
  floor = name;
  ROOMS = FLOORS[name].rooms;
  document.querySelectorAll("#floorlist button").forEach(b => b.classList.toggle("on", b.textContent === name));
  const list = document.getElementById("roomlist");
  list.innerHTML = "";
  for (const r of Object.keys(ROOMS)) {
    const b = document.createElement("button");
    b.textContent = r;
    b.onclick = () => showRoom(r);
    list.appendChild(b);
  }
  room = null;
  document.getElementById("angles").innerHTML = "";
}
for (const name of Object.keys(FLOORS)) {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => { go(FLOORS[name].view); showFloor(name); };
  document.getElementById("floorlist").appendChild(b);
}
function showRoom(name, i = 0) {
  room = name;
  document.querySelectorAll("#roomlist button").forEach(b => b.classList.toggle("on", b.textContent === name));
  const angles = document.getElementById("angles");
  angles.innerHTML = "";
  ROOMS[name].forEach(([label], k) => {
    const b = document.createElement("button");
    b.textContent = `${k + 1}. ${label}`;
    b.onclick = () => goAngle(k);
    angles.appendChild(b);
  });
  goAngle(i);
}
function goAngle(i) {
  const views = ROOMS[room];
  if (!views[i]) return;
  setView(views[i][1]);
  document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("on"));
  document.querySelectorAll("#angles button").forEach((b, k) => b.classList.toggle("on", k === i));
}
function clearRoom() {
  room = null;
  document.getElementById("angles").innerHTML = "";
  document.querySelectorAll("#roomlist button").forEach(b => b.classList.remove("on"));
}
addEventListener("keydown", e => { if (room && e.key >= "1" && e.key <= "9") goAngle(+e.key - 1); });

// Which storey a part of the model belongs to (by its Blender object name), for the cut-away
// views: 1 first floor (with its floor slab, and the flat roof next to it), 2 attic (with the
// first floor's ceiling), 3 the roof (with its gutters and solar panels) and the attic's ceiling
function levelOf(name) {
  const split = name.match(/_L(\d)$/);  // split per storey by export_viewer.py (STOREY_SPLIT)
  if (split) return +split[1];
  if (/^(Roof|Ext_Roof|attic_Lining|attic_Roof_Window)/.test(name)) return 3;
  if (/^(attic_|Ext_Gable)/.test(name)) return 2;
  if (/^(first_|Flat_Roof)/.test(name)) return 1;
  return 0;
}
let levelParts = [];
function setLevel(n) {
  levelParts.forEach(o => (o.visible = o.userData.level <= n));
}
function frameCamera() {
  const v = current;
  const aspect = innerWidth / innerHeight;
  camera.near = v && v.near ? v.near : 0.05;
  if (v && v.hfov) {  // match a Blender camera: horizontal FOV and vertical lens shift
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(v.hfov / 2) / aspect));
    camera.setViewOffset(innerWidth, innerHeight, 0, v.shiftY * -innerWidth, innerWidth, innerHeight);
  } else {
    camera.fov = 45;
    camera.clearViewOffset();
  }
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
}
let current = null;
function setView(v) {
  stopTour();
  current = v;
  frameCamera();
  camera.position.copy(v.pos);
  controls.target.copy(v.target);
  setLevel(v.level);
}
function go(name) {
  setView(VIEWS[name]);
  clearRoom();
  document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("on", b.dataset.view === name));
  document.querySelectorAll("#floorlist button").forEach(b => b.classList.remove("on"));
  document.getElementById("roomlist").innerHTML = "";
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));

// Automated walk from the canal into the house and up through all three storeys, smoothed the
// way blender/flythrough.py does it and played back in real time. The ground-floor part is
// that script's route (copied here, keep in step by hand); the street, the stairs and the
// upper floors are only in the web tour.
// (x, y, yaw deg [0 = +X, 90 = +Y towards the garden], pitch deg, hold s, floor z under the
// eye, default 0: on the stairs the line through the nosings)

  // across the road and up the drive to the front door

  [5.55, -11.20, 90, 0, 0, -0.26],      // over the verge to the kerb
  [5.50, -5.30, 90, 1, 0, -0.24],       // across the road onto the pavement
  [5.50, -1.50, 90, 2, 0, -0.24],       // up the drive, past the car
  [5.50, 0.80, 95, -2, 0, -0.24],       // the front door
  // the ground floor (blender/flythrough.py)
  [5.50, 1.75, 100, -4, 1.0],   // hall, just inside the front door
  [5.25, 2.40, 160, -6, 0.5],   // mirror, coat rail and bench
  [4.84, 3.20, 95, -4, 0],
  [4.82, 3.87, 80, -4, 0],      // through the opening (west of the hall curtain)
  [5.30, 4.35, 0, -6, 0],       // stair foot
  [6.17, 4.38, 0, -6, 0],       // guest room door
  [7.05, 4.10, -40, -12, 0],
  [7.35, 3.55, -60, -14, 1.0],  // daybed, desk, striped rug
  [7.35, 3.50, -95, -8, 1.0],   // window
  [6.90, 4.25, 165, -6, 0],
  [6.17, 4.40, 180, -6, 0],
  [5.25, 4.25, 185, -6, 0],
  [4.55, 4.05, 170, -6, 0],     // past the palm into the living room
  [3.80, 4.25, 150, -8, 0],
  [3.60, 5.30, 185, -10, 0.8],  // sofa, rug, coffee table
  [3.30, 4.50, 265, -6, 0],
  [3.25, 3.45, 250, -8, 0],     // study door
  [2.95, 2.55, 215, -12, 0.5],  // red desk and the window bench
  [2.95, 2.50, 150, -8, 0.5],   // wall shelves
  [3.25, 3.45, 85, -4, 0],
  [3.30, 4.50, 90, -4, 0],
  [3.45, 6.90, 115, -6, 0],
  [3.95, 8.00, 145, -8, 0.8],   // dining table, pendant, bookcase
  [4.25, 9.60, 95, -4, 0],
  [4.55, 9.15, 0, -6, 0],       // into the kitchen, south of the island
  [5.40, 9.00, 10, -8, 0],
  [6.10, 8.85, 25, -8, 0],      // between the concrete column and the wall
  [7.55, 9.10, 60, -8, 0],
  [7.85, 10.10, 95, -8, 0],     // round the end of the island
  [7.70, 11.30, 125, -10, 0],
  [6.60, 11.10, 85, -6, 0.8],   // counter under the windows
  [7.60, 11.35, 200, -10, 0.6], // back to the island and the column
  [7.85, 10.05, 235, -10, 0],
  [7.40, 9.05, 205, -6, 0],
  [6.10, 8.85, 190, -6, 0],
  [5.50, 8.95, 268, -6, 0],
  [5.49, 8.33, 270, -8, 0],     // sliding door to the corridor
  [5.50, 7.70, 270, -14, 1.0],  // washbasin niche under the stair
  [5.60, 7.70, 0, -6, 0],

  [7.74, 6.95, 270, -8, 0],

  [7.74, 5.78, 330, -14, 0.5],  // toilet and towel ladder

  [4.05, 7.40, 262, -8, 0],

  // up the stair to the first floor (blender/rooms/architecture/stair.py: 14 risers; seven
  // straight treads from y 4.82 to the black post at (5.035, 6.08), then six winders turning west
  // round it onto the landing): the walking line 0.485 m from the post, the floor z on the line
  // through the nosings
  [4.50, 4.15, 5, -4, 0],

  [5.52, 4.75, 90, 10, 0],      // the foot of the stair

  [5.455, 6.323, 120, 4, 0, Z1 * 10 / 14],

  [5.035, 6.565, 180, -2, 0, Z1],             // the landing step

// speed: walking pace (m/s, along the slope on the stairs), street: outside (floor below 0)
const TOUR = { fps: 25, speed: 0.65, street: 1.0, turn: 50, eye: 1.5, lens: 16, smooth: 0.7 };

function tourFrames() {
  const { fps, turn, smooth } = TOUR;
  const R = TOUR_ROUTE.map(([x, y, yaw, pitch, hold, z = 0]) => [x, y, yaw, pitch, hold, z]);
  const yaws = [R[0][2]];
  for (const r of R.slice(1)) {  // unwrap so the camera always turns the short way
    let y = r[2];
    while (y - yaws.at(-1) > 180) y -= 360;
    while (y - yaws.at(-1) < -180) y += 360;
    yaws.push(y);
  }
  const catmull = (p0, p1, p2, p3, t) => 0.5 * ((2 * p1) + (-p0 + p2) * t
    + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t * t + (-p0 + 3 * p1 - 3 * p2 + p3) * t ** 3);
  // frames: [x, y, yaw, pitch, floor z]
  const frames = [];
  for (let i = 0; i < R.length; i++) {
    for (let k = 0; k < Math.floor(R[i][4] * fps); k++) frames.push([R[i][0], R[i][1], yaws[i], R[i][3], R[i][5]]);
    if (i === R.length - 1) break;
    const dist = Math.hypot(R[i + 1][0] - R[i][0], R[i + 1][1] - R[i][1], R[i + 1][5] - R[i][5]);
    const speed = R[i][5] < 0 && R[i + 1][5] < 0 ? TOUR.street : TOUR.speed;
    const dur = Math.max(dist / speed, Math.abs(yaws[i + 1] - yaws[i]) / turn, 0.4);
    const n = Math.max(2, Math.floor(dur * fps));
    const a = R[Math.max(i - 1, 0)], d = R[Math.min(i + 2, R.length - 1)];
    for (let k = 0; k < n; k++) {
      const t = k / n, e = t * t * (3 - 2 * t);  // ease the look direction
      frames.push([catmull(a[0], R[i][0], R[i + 1][0], d[0], t), catmull(a[1], R[i][1], R[i + 1][1], d[1], t),
                   yaws[i] + (yaws[i + 1] - yaws[i]) * e, R[i][3] + (R[i + 1][3] - R[i][3]) * e,
                   catmull(a[5], R[i][5], R[i + 1][5], d[5], t)]);
    }
  }
  frames.push([R.at(-1)[0], R.at(-1)[1], yaws.at(-1), R.at(-1)[3], R.at(-1)[5]]);
  const w = Math.floor(smooth * fps), out = [];  // gaussian smoothing
  const kern = Array.from({ length: 2 * w + 1 }, (_, k) => Math.exp(-0.5 * ((k - w) / (w / 2.5)) ** 2));
  for (let f = 0; f < frames.length; f++) {
    const acc = [0, 0, 0, 0, 0];
    let tot = 0;
    kern.forEach((g, k) => {
      const src = frames[Math.min(Math.max(f + k - w, 0), frames.length - 1)];
      for (let c = 0; c < 5; c++) acc[c] += g * src[c];
      tot += g;
    });
    out.push(acc.map(v => v / tot));
  }
  return out;
}
const tourTrack = tourFrames();
let doorLeaves = [];  // doors the route passes through, hidden while touring
let doorCuts = [];    // [geometry, its index, the index without the door] for doors merged into other meshes
let tour = null;      // { t: seconds into the track, playing }
function openDoors(open) {
  doorLeaves.forEach(o => (o.visible = !open));
  doorCuts.forEach(([g, full, cut]) => g.setIndex(open ? cut : full));
}
const tourBtn = document.getElementById("tour");

function tourLabel() {
  tourBtn.textContent = !tour ? "▶ Tour" : tour.playing ? "❚❚ Pause tour" : "▶ Resume tour";
  tourBtn.classList.toggle("on", !!tour);
}
function startTour() {
  if (!tour) {
    setView({ pos: camera.position.clone(), target: controls.target.clone(), level: 3,
              hfov: 2 * Math.atan(18 / TOUR.lens), shiftY: 0, near: 0.12 });
    clearRoom();
    document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("on"));
    openDoors(true);
    tour = { t: 0, playing: true };
  }
  tour.playing = true;
  tourLabel();
}
function stopTour() {
  if (!tour) return;
  tour = null;
  openDoors(false);
  tourLabel();
}
function pauseTour() {
  if (tour && tour.playing) { tour.playing = false; tourLabel(); }
}
tourBtn.onclick = () => (tour && tour.playing ? pauseTour() : startTour());
addEventListener("keydown", e => {
  if (e.key === " " && tour) { e.preventDefault(); tour.playing ? pauseTour() : startTour(); }
  if (e.key === "Escape") stopTour();
});
function placeTour() {
  const f = tour.t * TOUR.fps, last = tourTrack.length - 1;
  const i = Math.min(Math.floor(f), last), j = Math.min(i + 1, last), u = Math.min(f - i, 1);
  const [x, y, yaw, pitch, z] = tourTrack[i].map((v, c) => v + (tourTrack[j][c] - v) * u);
  const a = THREE.MathUtils.degToRad(yaw), p = THREE.MathUtils.degToRad(pitch), eye = z + TOUR.eye;
  camera.position.copy(B(x, y, eye));
  controls.target.copy(B(x + 1.5 * Math.cos(a) * Math.cos(p), y + 1.5 * Math.sin(a) * Math.cos(p),
                         eye + 1.5 * Math.sin(p)));
}
function stepTour(dt) {
  if (!tour || !tour.playing) return;
  tour.t += dt;
  const last = tourTrack.length - 1;
  if (tour.t * TOUR.fps >= last) {  // finished in the attic: hand back to the orbit controls
    tour.t = last / TOUR.fps;
    tour.playing = false;
  }
  placeTour();
  if (!tour.playing) { stopTour(); tourBtn.textContent = "↺ Tour again"; }
}
// from the console: viewer.seekTour(seconds) jumps the tour there, paused
window.viewer.seekTour = s => { startTour(); tour.t = s; pauseTour(); placeTour(); };
// for the review mode (see the end of the model load)
Object.assign(window.viewer, {
  pauseTour,
  goTo(v) {  // a saved camera: no view, room or angle button lit
    setView(v);
    clearRoom();
    document.querySelectorAll("[data-view]").forEach(b => b.classList.remove("on"));
  },
  state: () => ({
    level: current ? current.level : 3, room, tour: tour ? tour.t : null,
    view: document.querySelector("[data-view].on")?.dataset.view ?? null,
    floor: document.querySelector("#floorlist button.on")?.textContent ?? null,
    angle: document.querySelector("#angles button.on")?.textContent ?? null,
  }),
});

// Baked surfaces (materials "viewer_*" from blender/export_viewer.py): colour map x light
// map, with the light map stored as light / LIGHT_SCALE in the emissive slot.
const LIGHT_SCALE = 8.0;
const WHITE_BALANCE = new THREE.Vector3(1.040, 0.996, 0.930);  // Blender's 7000 K setting
function bakedMaterial(m) {
  return new THREE.ShaderMaterial({
    name: m.name,
    side: m.side,
    uniforms: { map: { value: m.map }, lightMap: { value: m.emissiveMap },
                scale: { value: m.emissiveMap ? LIGHT_SCALE : 1.0 }, wb: { value: WHITE_BALANCE } },
    defines: m.emissiveMap ? { USE_LIGHT: "" } : {},
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D map; uniform sampler2D lightMap; uniform float scale; uniform vec3 wb;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(map, vUv).rgb;
        #ifdef USE_LIGHT
          c *= texture2D(lightMap, vUv).rgb * scale;
        #endif
        gl_FragColor = vec4(c * wb, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
  });
}

// Lite: the size a texture loads at (half the side from 512 px up, at most 1024 px)
function liteSize(w, h) {
  const s = Math.max(w, h) < 512 ? 1 : Math.min(0.5, 1024 / Math.max(w, h));
  return [Math.max(1, Math.round(w * s)), Math.max(1, Math.round(h * s))];
}
function shrinkCanvas(img, w, h) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  c.getContext("2d").drawImage(img, 0, 0, w, h);
  return c;
}
// Lite: GLTFLoader decodes all of the model's images at once with createImageBitmap. While it
// parses, each one is shrunk as soon as it is decoded, so the full-size copies never pile up.
const createBitmap = window.createImageBitmap;
async function smallBitmap(blob, options = {}) {
  const full = await createBitmap.call(window, blob, options);
  const [w, h] = liteSize(full.width, full.height);
  if (w === full.width && h === full.height) return full;
  const { imageOrientation, ...opts } = options;  // already applied to `full`
  let small = await createBitmap.call(window, full, { ...opts, resizeWidth: w, resizeHeight: h, resizeQuality: "high" });
  if (small.width !== w) {  // the browser ignored the resize options
    small.close();
    small = await createBitmap.call(window, shrinkCanvas(full, w, h), opts);
  }
  full.close();
  return small;
}
// Lite, after parsing: shrink images that loaded at full size (<img>, where createImageBitmap is
// missing), and let the CPU copies of textures and geometry go once they are on the GPU.
function lighten(root) {
  const textures = new Set(), geometries = new Set();
  root.traverse(o => {
    if (!o.isMesh) return;
    geometries.add(o.geometry);
    for (const m of [o.material].flat())
      for (const v of Object.values(m)) if (v && v.isTexture) textures.add(v);
  });
  const shrunk = new Map(), users = new Map();  // full-size <img> -> canvas; image -> textures still to upload it
  for (const t of textures) {
    if (t.image instanceof HTMLImageElement) {
      if (!shrunk.has(t.image)) shrunk.set(t.image, shrinkCanvas(t.image, ...liteSize(t.image.width, t.image.height)));
      t.image = shrunk.get(t.image);
      t.needsUpdate = true;
    }
    users.set(t.image, (users.get(t.image) || 0) + 1);
  }
  for (const t of textures) t.onUpdate = () => {
    const left = users.get(t.image) - 1;
    users.set(t.image, left);
    if (left) return;
    if (t.image.close) t.image.close();  // ImageBitmap
    else t.image.width = t.image.height = 0;  // canvas
  };
  for (const g of geometries) {
    g.computeBoundingBox();  // culling needs these after the arrays are gone
    g.computeBoundingSphere();
    for (const a of [...Object.values(g.attributes), g.index])
      if (a && a.isBufferAttribute) a.onUpload(function () { this.array = null; });
  }
}

const draco = new DRACOLoader().setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/");
// GitHub Pages lets browsers reuse files for 10 minutes (max-age=600). "no-cache" makes the
// browser check with the server on every visit: a cheap 304 when house.glb hasn't changed,
// the new model as soon as it has, and never a re-download of an unchanged 43 MB.
const gltfLoader = new GLTFLoader().setDRACOLoader(draco);
fetch("house.glb", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.arrayBuffer(); })
  .then(buf => {
    if (LITE && createBitmap)
      window.createImageBitmap = (src, ...rest) =>
        src instanceof Blob && rest.length <= 1 ? smallBitmap(src, rest[0]) : createBitmap.call(window, src, ...rest);
    return gltfLoader.parseAsync(buf, "").finally(() => { if (createBitmap) window.createImageBitmap = createBitmap; });
  })
  .then(gltf => {
  const root = gltf.scene;
  if (LITE) {
    lighten(root);
    draco.dispose();  // the decoder workers and their memory
  }
  let baked = 0;
  root.traverse(o => {
    if (o.isMesh) {
      if (o.material.name.startsWith("viewer_") && o.material.map) {
        o.material = bakedMaterial(o.material);
        o.castShadow = o.receiveShadow = false;  // light is already in the bake
        baked++;
      } else {
        o.castShadow = o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => { if (m.transparent) o.castShadow = false; });
        mats.forEach(m => { if (m.name === "Ext_Water") m.envMap = skyEnv; });
      }
      // wall tops (unbaked, see export_viewer.py WALL_TOPS) are the section cut of the cut-away
      // views: evenly lit, no shadows (they would show the sun's shadow-map acne)
      let top = o;
      while (top.parent && top.parent !== root) top = top.parent;
      if (/_Walls_Tops$/.test(top.name)) o.castShadow = o.receiveShadow = false;
    }
    if (o.parent === root) {
      o.userData.level = levelOf(o.name);
      if (o.userData.level) levelParts.push(o);
    }
  });
  // door leaves (and their handles) within 0.5 m of the tour's path on their own storey are the
  // ones it walks through
  root.updateMatrixWorld(true);
  for (const o of [...root.children]) {
    if (!/^(Arch_Door_\d+|(first|attic)_Hall_Door_[A-Za-z]+)_Leaf$|^Hall_Front_Door$/.test(o.name)) continue;
    const box = new THREE.Box3().setFromObject(o), c = box.getCenter(new THREE.Vector3());  // three coords
    if (!tourTrack.some(([x, y, , , z]) => Math.hypot(x - c.x, -y - c.z) < 0.5 && Math.abs(z - box.min.y) < 0.5)) continue;
    doorLeaves.push(o);
    const handles = root.getObjectByName(o.name.replace(/(_Leaf)?$/, "_Hardware"));
    if (handles) doorLeaves.push(handles);
  }
  // parts of other meshes inside those leaves (the front door's outside skin and glass in
  // Ext_House_Details_L0, a panel in ground_Windows_Doors) are cut out of them while touring
  const leafBoxes = doorLeaves.filter(o => !/_Hardware$/.test(o.name))
    .map(o => new THREE.Box3().setFromObject(o).expandByVector(new THREE.Vector3(-0.01, 0.01, -0.01)));
  const cutFrom = [];
  root.traverse(m => {
    if (!m.isMesh || !m.geometry.index) return;
    let top = m;
    while (top.parent !== root) top = top.parent;
    const boxes = leafBoxes.filter(b => b.intersectsBox(new THREE.Box3().setFromObject(m)));
    if (doorLeaves.includes(top) || !boxes.length) return;
    const pos = m.geometry.attributes.position, idx = m.geometry.index.array, keep = [];
    const p = [0, 1, 2].map(() => new THREE.Vector3());
    for (let i = 0; i < idx.length; i += 3) {
      p.forEach((v, k) => v.fromBufferAttribute(pos, idx[i + k]).applyMatrix4(m.matrixWorld));
      if (!boxes.some(b => p.every(v => b.containsPoint(v)))) keep.push(idx[i], idx[i + 1], idx[i + 2]);
    }
    if (keep.length === idx.length) return;
    doorCuts.push([m.geometry, m.geometry.index, new THREE.BufferAttribute(new Uint32Array(keep), 1)]);
    cutFrom.push(m.name);
  });
  console.log("tour doors:", doorLeaves.map(o => o.name), "cut from:", cutFrom);
  console.log("baked meshes:", baked);
  scene.add(root);
  document.getElementById("loading").remove();
  go("album");
  showFloor("Ground floor");
  if (params.has("tour")) startTour();  // ?tour opens straight into the walk
  // Review mode: on localhost only, where tools/review/server.py (in the private source repo)
  // serves review/review.js. GitHub Pages, or a plain local server, has no such file.
  window.viewer.root = root;
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname))
    import("./review/review.js").then(m => m.start(window.viewer)).catch(e => console.log("no review mode:", e.message));
}).catch(err => {
  document.getElementById("loading").textContent = "Could not load house.glb: " + err.message;
});

addEventListener("resize", () => {
  frameCamera();
  renderer.setSize(innerWidth, innerHeight);
});
// orbiting away from a matched view goes back to a normal perspective
controls.addEventListener("start", () => {
  pauseTour();
  if (current && (current.shiftY || current.near)) { current = { ...current, shiftY: 0, near: 0 }; frameCamera(); }
});
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  stepTour(Math.min(clock.getDelta(), 0.1));  // a hidden tab doesn't jump ahead
  controls.update();
  renderer.render(scene, camera);
});
</script>
